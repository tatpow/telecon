name: Checks

on:
  push:
    branches: ['**'] # Branch updates only; publishing a release tag must not repeat Checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-build.lock.txt
      - name: Install Linux/macOS dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-build-posix.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check ui/app.js
          node --check ui/motion.js
      - name: Python syntax
        run: python -m compileall -q app.py capabilities.py build_desktop.py build_windows.py build_installer.py build_posix_installers.py version.py portable_diagnostics.py ui_document.py tray.py tray_windows.py tray_cocoa.py tray_qt.py tests/check_linux_installers.py tests/check_macos_installers.py
      - name: Install headless Chromium for UI regressions
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Browser UI regressions (reduced motion, dialog focus, polling)
        if: runner.os == 'Linux'
        run: python tests/check_ui.py
